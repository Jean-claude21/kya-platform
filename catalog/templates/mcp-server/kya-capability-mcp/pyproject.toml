[project]
name = "kya-capability-mcp"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["mcp>=2,<3", "pydantic>=2.12"]

[project.scripts]
kya-capability-mcp = "kya_capability_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.2", "ruff>=0.13", "mypy>=1.18"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

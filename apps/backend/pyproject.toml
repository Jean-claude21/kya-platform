[project]
name = "kya-platform-backend"
version = "0.0.1"
description = "Backend métier, API et surfaces MCP de KYA Platform"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aioboto3>=15.5,<16",
  "alembic>=1.16",
  "asyncpg>=0.30",
  "cryptography>=46",
  "fastapi>=0.116",
  "httpx>=0.28",
  "mcp>=2,<3",
  "opentelemetry-exporter-otlp-proto-http>=1.39",
  "opentelemetry-sdk>=1.39",
  "packaging>=26,<27",
  "pyjwt[crypto]>=2.12",
  "pydantic-settings>=2.10",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.35",
]

[project.scripts]
kya-api = "kya_platform.main:run"
kya-web-capture-worker = "kya_platform.workers.web_capture_runtime:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kya_platform"]

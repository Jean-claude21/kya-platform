[project]
name = "kya-platform-backend"
version = "0.0.1"
description = "Backend métier, API et surfaces MCP de KYA Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116",
  "pydantic-settings>=2.10",
  "uvicorn[standard]>=0.35",
]

[project.scripts]
kya-api = "kya_platform.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kya_platform"]

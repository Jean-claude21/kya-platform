[project]
name = "kya-platform-workspace"
version = "0.0.1"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.15",
  "httpx2>=0.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.uv.workspace]
members = ["apps/backend"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=kya_platform",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
asyncio_mode = "auto"
testpaths = ["apps/backend/tests"]
markers = [
  "unit: tests without infrastructure",
  "integration: tests using controlled infrastructure",
  "contract: public contract tests",
  "security: security and authorization tests",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["apps/backend/src", "apps/backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"apps/backend/tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["apps/backend/src"]
packages = ["kya_platform"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

name: Preview and promotion

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      provider:
        description: Deployment provider
        required: true
        type: choice
        options: [dokploy, coolify]
      source_commit:
        description: Exact commit SHA to deploy from the selected branch
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options: [preview, staging, production]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-data:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
      - run: uv sync --locked --all-packages
      - name: Create or clean Neon preview branch
        env:
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          ACTION: ${{ github.event.action == 'closed' && 'cleanup' || 'ensure' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          uv run --package kya-platform-backend python infra/neon/preview_branch.py
          "$ACTION" --pull-request "$PR_NUMBER" --commit "$COMMIT_SHA"

  guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate source commit
        env:
          REF: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          echo "$SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          git fetch --no-tags origin "$REF"
          test "$SOURCE_COMMIT" = "$(git rev-parse "origin/$REF")"
          if [ "$ENVIRONMENT" = "production" ]; then
            test "$REF" = "main"
          fi

  promote:
    if: github.event_name == 'workflow_dispatch'
    needs: guard
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Deploy KYA-Platform backend through Coolify
        if: inputs.provider == 'coolify'
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APPLICATION_NAME: kya-platform-backend
          APPLICATION_HOST: api.kya-platform.vttlife.com
        run: |
          set -euo pipefail
          api_root="${COOLIFY_API_URL%/}"
          if [[ "$api_root" != */api/v1 ]]; then
            api_root="$api_root/api/v1"
          fi

          applications="$(curl --fail --silent --show-error \
            --retry 3 \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$api_root/applications")"
          application_uuid="$(jq -er \
            --arg name "$APPLICATION_NAME" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg host "$APPLICATION_HOST" \
            '[.[] | select(
               .name == $name and
               .git_branch == $branch and
               ((.fqdn // "") | contains($host))
             )] |
             if length == 1 then .[0].uuid
             elif length == 0 then error("Coolify application not found for name, branch, and host")
             else error("Coolify application selection is ambiguous") end' \
            <<<"$applications")"

          deployment="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$api_root/deploy?uuid=$application_uuid&force=true")"
          deployment_uuid="$(jq -er '.deployments[0].deployment_uuid' <<<"$deployment")"

          for attempt in $(seq 1 60); do
            status="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$api_root/deployments/$deployment_uuid" | jq -er '.status')"
            case "$status" in
              finished)
                echo "Coolify deployment $deployment_uuid finished."
                exit 0
                ;;
              failed|cancelled)
                echo "Coolify deployment $deployment_uuid ended with status $status." >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Coolify deployment $deployment_uuid did not finish within 10 minutes." >&2
          exit 1

      - name: Reject unimplemented deployment providers
        if: inputs.provider != 'coolify'
        run: |
          echo "Deployment provider '${{ inputs.provider }}' is not implemented." >&2
          exit 1

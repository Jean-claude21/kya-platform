name: Release integrity

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require annotated SemVer tag on main
        run: |
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" \
            main
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag"
          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")"
          test "$(git rev-parse origin/main)" = "$TAG_COMMIT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build the deterministic Claude plugin archive
        run: python infra/claude/package_plugin.py
      - name: Attach the Claude plugin archive to release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kya-platform-claude-plugin-${{ github.ref_name }}
          path: dist/kya-platform-claude-plugin-*.zip
          if-no-files-found: error
          retention-days: 30

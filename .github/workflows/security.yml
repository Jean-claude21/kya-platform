name: Security controls

on:
  pull_request:
    branches: [dev]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    name: Dependencies, secrets and configuration
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.impact.outputs.containers }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Detect container-impacting changes
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "containers=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            apps/backend \
            apps/web \
            catalog/releases \
            packages \
            infra/containers \
            .github/workflows/security.yml \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            pyproject.toml \
            tsconfig.json \
            turbo.json \
            uv.lock; then
            echo "containers=false" >> "$GITHUB_OUTPUT"
          else
            echo "containers=true" >> "$GITHUB_OUTPUT"
          fi

  container-security:
    name: Containers and SBOM
    needs: repository-security
    if: needs.repository-security.outputs.containers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Enable reusable BuildKit cache
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/containers/Dockerfile.backend
          tags: kya-platform-backend:scan
          load: true
          cache-from: type=gha,scope=kya-backend
          cache-to: type=gha,mode=min,scope=kya-backend
      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/containers/Dockerfile.web
          tags: kya-platform-web:scan
          load: true
          cache-from: type=gha,scope=kya-web
          cache-to: type=gha,mode=min,scope=kya-web
      - name: Build source scheduler image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/containers/Dockerfile.source-scheduler
          tags: kya-platform-source-scheduler:scan
          load: true
          cache-from: type=gha,scope=kya-source-scheduler
          cache-to: type=gha,mode=min,scope=kya-source-scheduler
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kya-platform-backend:scan
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kya-platform-web:scan
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Scan source scheduler image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kya-platform-source-scheduler:scan
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Generate backend CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kya-platform-backend:scan
          format: cyclonedx
          output: sbom-backend.cdx.json
          exit-code: '0'
      - name: Generate web CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kya-platform-web:scan
          format: cyclonedx
          output: sbom-web.cdx.json
          exit-code: '0'
      - name: Generate source scheduler CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kya-platform-source-scheduler:scan
          format: cyclonedx
          output: sbom-source-scheduler.cdx.json
          exit-code: '0'
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kya-platform-sbom-${{ github.sha }}
          path: |
            sbom-backend.cdx.json
            sbom-source-scheduler.cdx.json
            sbom-web.cdx.json
          if-no-files-found: error
          retention-days: 30

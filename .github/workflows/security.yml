name: Security controls

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    name: Dependencies, secrets and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  container-security:
    name: Containers and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build backend image
        run: docker build --file infra/containers/Dockerfile.backend --tag kya-platform-backend:scan .
      - name: Build web image
        run: docker build --file infra/containers/Dockerfile.web --tag kya-platform-web:scan .
      - name: Build source scheduler image
        run: >-
          docker build --file infra/containers/Dockerfile.source-scheduler
          --tag kya-platform-source-scheduler:scan .
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kya-platform-backend:scan
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kya-platform-web:scan
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Scan source scheduler image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kya-platform-source-scheduler:scan
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Generate backend CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kya-platform-backend:scan
          format: cyclonedx
          output: sbom-backend.cdx.json
          exit-code: '0'
      - name: Generate web CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kya-platform-web:scan
          format: cyclonedx
          output: sbom-web.cdx.json
          exit-code: '0'
      - name: Generate source scheduler CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kya-platform-source-scheduler:scan
          format: cyclonedx
          output: sbom-source-scheduler.cdx.json
          exit-code: '0'
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kya-platform-sbom-${{ github.sha }}
          path: |
            sbom-backend.cdx.json
            sbom-source-scheduler.cdx.json
            sbom-web.cdx.json
          if-no-files-found: error
          retention-days: 30

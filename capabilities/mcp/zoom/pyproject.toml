[project]
name = "kya-zoom-mcp"
version = "0.1.0"
description = "Governed Zoom meeting capability for KYA-Platform."
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "pydantic>=2.12,<3",
  "tzdata>=2025.3",
]

[project.scripts]
kya-zoom-mcp = "kya_zoom_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=9",
  "pytest-asyncio>=1.2",
  "respx>=0.22",
  "ruff>=0.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["kya_zoom_mcp"]

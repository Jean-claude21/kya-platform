site_name: KYA Platform Documentation
site_description: Governed documentation for KYA-Energy Group's digital platform.
docs_dir: docs
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Decisions:
          - FastAPI backend: adr/0001-fastapi-backend.md
          - Neon Auth and Storage: adr/0002-neon-auth-and-storage.md
          - KYA Core: adr/0003-kya-core-canonical-master-data.md
          - Data Foundation: adr/0004-data-foundation.md
          - Governed Data MCP: adr/0005-governed-data-mcp.md
          - Owned web connector: adr/0006-owned-web-capture-connector.md
  - Artifact Factory:
      - Master templates: artifacts/master-templates.md
  - Operations:
      - Required credentials: operations/required-credentials.md
  - Governance:
      - Repository: governance/repository.md
  - Contributing:
      - Documentation workflow: contributing/documentation.md
